name: Stage 11 THREAT Tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/stage11-threat.test.mjs'
      - '.github/workflows/test-stage11-threat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/stage11-threat.test.mjs
