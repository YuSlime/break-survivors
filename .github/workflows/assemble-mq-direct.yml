name: Assemble Missile Queen direct audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-mq-direct.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble direct-reference master
        shell: bash
        run: |
          set -euo pipefail
          tmp_b64="$(mktemp)"
          for i in 0 1 2 3 4 5 6; do
            head -c 10960 ".tmp_mq_audio/part${i}.txt" >> "$tmp_b64"
          done
          head -c 10956 ".tmp_mq_audio/part7.txt" >> "$tmp_b64"
          clean_b64="$(mktemp)"
          tr -d '\r\n\t ' < "$tmp_b64" > "$clean_b64"
          test "$(wc -c < "$clean_b64")" -eq 87676
          base64 -d "$clean_b64" > assets/sfx/missilequeen/queen_direct_master.mp3
          test "$(stat -c%s assets/sfx/missilequeen/queen_direct_master.mp3)" -eq 65756
      - name: Commit finalized audio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp_mq_audio
          rm -f .github/workflows/assemble-mq-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Missile Queen direct-reference master audio"
          git push
