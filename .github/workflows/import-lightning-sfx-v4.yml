name: Import Lightning SFX V4

on:
  push:
    paths:
      - '.github/workflows/import-lightning-sfx-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Import lightning V4
        run: |
          set -e
          mkdir -p tmp assets/sfx/v4
          FIRE_URL="$(printf '%s' '' | base64 -d)"
          HIT_URL="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$FIRE_URL" -o tmp/lightning_fire.mp3
          curl -L --fail --retry 3 "$HIT_URL" -o tmp/lightning_hit.mp3
          ffmpeg -hide_banner -loglevel error -y -i tmp/lightning_fire.mp3 -af "atrim=duration=0.52,highpass=f=45,lowpass=f=13500,afade=t=out:st=0.45:d=0.07,loudnorm=I=-27:TP=-7:LRA=7" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k assets/sfx/v4/lightning_fire.mp3
          ffmpeg -hide_banner -loglevel error -y -i tmp/lightning_hit.mp3 -af "atrim=duration=0.62,highpass=f=45,lowpass=f=13500,afade=t=out:st=0.54:d=0.08,loudnorm=I=-28:TP=-8:LRA=7" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k assets/sfx/v4/lightning_hit.mp3
      - name: Verify
        run: |
          test -s assets/sfx/v4/lightning_fire.mp3
          test -s assets/sfx/v4/lightning_hit.mp3
      - name: Commit
        run: |
          git config user.name "BREAK SURVIVORS Bot"
          git config user.email "actions@github.com"
          git add assets/sfx/v4
          git commit -m "Add buzzing electrocution lightning SFX V4" || exit 0
          git push
