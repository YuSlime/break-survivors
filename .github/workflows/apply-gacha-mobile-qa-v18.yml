name: Apply Orbital Gacha Mobile QA v18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gacha-mobile-qa-v18.yml'

permissions:
  contents: write

jobs:
  mobile-qa:
    if: github.event.head_commit.message == 'Add one-shot orbital gacha mobile QA workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - mobile composition fix is absent
        id: red
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'stage162OrbitalMobileComposition' in s, 'expected RED: stage162 is not implemented yet'
          PY

      - name: Assert RED failed
        if: steps.red.outcome != 'failure'
        run: exit 1

      - name: Apply Stage 16.2 screenshot-driven repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=Path('tools/gacha-stage162.css').read_text(encoding='utf-8')
          if 'stage162OrbitalMobileComposition' in s:
              raise SystemExit('stage162 already exists')
          p.write_text(s.replace('</head>',css+'\n</head>',1),encoding='utf-8')
          PY

      - name: GREEN - static QA and existing tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['stage162OrbitalMobileComposition','display:block!important','grid-template-columns:none!important','.summonDeck150','@media(max-width:340px)']
          missing=[x for x in required if x not in s]
          assert not missing, f'missing: {missing}'
          assert s.count('stage162OrbitalMobileComposition')==1
          print('mobile composition static QA: OK')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const scripts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!scripts.length) throw new Error('no inline scripts');
          scripts.forEach((code,i)=>{try{new Function(code)}catch(e){throw new Error('inline script '+i+': '+e.message)}});
          console.log('inline JS compile: OK ('+scripts.length+')');
          NODE
          node --test tests/stage11-threat.test.mjs tests/stage11-1-escalation.test.mjs

      - name: Render screenshot QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          hook="<script>addEventListener('load',()=>setTimeout(()=>{const b=document.getElementById('openGacha');if(b)b.click();},250));</script>"
          Path('qa-gacha.html').write_text(s.replace('</body>',hook+'</body>',1),encoding='utf-8')
          PY
          python3 -m http.server 4173 >/tmp/qa-http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=3500 --screenshot=qa-v18-desktop.png http://127.0.0.1:4173/qa-gacha.html
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3500 --screenshot=qa-v18-mobile.png http://127.0.0.1:4173/qa-gacha.html
          else
            echo 'Chrome unavailable' > qa-render-skipped.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-gacha-qa-v18
          path: |
            qa-v18-desktop.png
            qa-v18-mobile.png
            qa-render-skipped.txt
          if-no-files-found: warn

      - name: Commit repaired composition
        run: |
          rm -f qa-gacha.html qa-v18-desktop.png qa-v18-mobile.png qa-render-skipped.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair orbital gacha mobile composition and CTA hierarchy"
          git push
