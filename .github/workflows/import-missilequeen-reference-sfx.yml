name: Import Missile Queen Reference SFX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-missilequeen-reference-sfx.yml'
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download reference-inspired SFX
        shell: bash
        env:
          U1_HEX: ""
          U2_HEX: ""
          U3_HEX: ""
          U4_HEX: ""
          U5_HEX: ""
          U6_HEX: ""
          U7_HEX: ""
          U8_HEX: ""
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/missilequeen
          decode(){ printf '%s' "$1" | xxd -r -p; }
          curl -L --fail --retry 3 "$(decode "$U1_HEX")" -o "assets/sfx/missilequeen/queen_ref_launch_a.mp3"
          curl -L --fail --retry 3 "$(decode "$U2_HEX")" -o "assets/sfx/missilequeen/queen_ref_launch_b.mp3"
          curl -L --fail --retry 3 "$(decode "$U3_HEX")" -o "assets/sfx/missilequeen/queen_ref_swarm.mp3"
          curl -L --fail --retry 3 "$(decode "$U4_HEX")" -o "assets/sfx/missilequeen/queen_ref_second.mp3"
          curl -L --fail --retry 3 "$(decode "$U5_HEX")" -o "assets/sfx/missilequeen/queen_skyfall_launch.mp3"
          curl -L --fail --retry 3 "$(decode "$U6_HEX")" -o "assets/sfx/missilequeen/queen_skyfall_dive.mp3"
          curl -L --fail --retry 3 "$(decode "$U7_HEX")" -o "assets/sfx/missilequeen/queen_decree_drop.mp3"
          curl -L --fail --retry 3 "$(decode "$U8_HEX")" -o "assets/sfx/missilequeen/queen_crown_burst.mp3"
          for f in assets/sfx/missilequeen/queen_ref_*.mp3 assets/sfx/missilequeen/queen_skyfall_*.mp3 assets/sfx/missilequeen/queen_decree_drop.mp3 assets/sfx/missilequeen/queen_crown_burst.mp3; do test -s "$f"; test "$(stat -c%s "$f")" -gt 2000; done
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-missilequeen-reference-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Missile Queen reference-inspired SFX"
          git push
