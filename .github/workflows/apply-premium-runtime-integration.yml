name: Apply Premium Runtime Integration

on:
  push:
    branches: [premium-edition-foundation]
    paths:
      - tools/apply-premium-runtime-integration.mjs

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-edition-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded index integration
        run: node tools/apply-premium-runtime-integration.mjs
      - name: Verify patch and complete suite
        run: |
          git diff --check
          node --test tests/*.test.mjs
      - name: Commit generated index integration
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: wire Premium runtime into live game"
          git push origin HEAD:premium-edition-foundation
