name: Import Bomb Cat Cataclysm ULT SFX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-bombcat-cataclysm-ult-sfx.yml'
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Runway ULT SFX
        shell: bash
        env:
          ARM_B64: ""
          A_B64: ""
          B_B64: ""
          H_B64: ""
          P_B64: ""
          F_B64: ""
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/bombcat/ult
          decode(){ printf '%s' "$1" | base64 -d; }
          curl -L --fail --retry 3 "$(decode "$ARM_B64")" -o assets/sfx/bombcat/ult/cataclysm_arm.mp3
          curl -L --fail --retry 3 "$(decode "$A_B64")" -o assets/sfx/bombcat/ult/cataclysm_bomb_a.mp3
          curl -L --fail --retry 3 "$(decode "$B_B64")" -o assets/sfx/bombcat/ult/cataclysm_bomb_b.mp3
          curl -L --fail --retry 3 "$(decode "$H_B64")" -o assets/sfx/bombcat/ult/cataclysm_bomb_heavy.mp3
          curl -L --fail --retry 3 "$(decode "$P_B64")" -o assets/sfx/bombcat/ult/cataclysm_prefinal.mp3
          curl -L --fail --retry 3 "$(decode "$F_B64")" -o assets/sfx/bombcat/ult/cataclysm_final.mp3
          for f in assets/sfx/bombcat/ult/*.mp3; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 2000
          done
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-bombcat-cataclysm-ult-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Bomb Cat CATACLYSM ULT Runway SFX"
          git push
