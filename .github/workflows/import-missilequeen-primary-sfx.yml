name: Import Missile Queen Primary SFX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-missilequeen-primary-sfx.yml'
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download primary SFX
        shell: bash
        env:
          U1_HEX: ""
          U2_HEX: ""
          U3_HEX: ""
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/missilequeen
          decode(){ printf '%s' "$1" | xxd -r -p; }
          curl -L --fail --retry 3 "$(decode "$U1_HEX")" -o "assets/sfx/missilequeen/queen_primary_a.mp3"
          curl -L --fail --retry 3 "$(decode "$U2_HEX")" -o "assets/sfx/missilequeen/queen_primary_b.mp3"
          curl -L --fail --retry 3 "$(decode "$U3_HEX")" -o "assets/sfx/missilequeen/queen_primary_command.mp3"
          for f in assets/sfx/missilequeen/queen_primary_*.mp3; do test -s "$f"; test "$(stat -c%s "$f")" -gt 2000; done
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-missilequeen-primary-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Missile Queen primary SFX"
          git push
