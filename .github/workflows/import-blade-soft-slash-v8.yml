name: Import Blade Master Soft Slash SFX v8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-blade-soft-slash-v8.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download generated slash SFX
        run: |
          set -euo pipefail
          mkdir -p /tmp/blade-v8 assets/sfx/v8
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/398e098e-69c6-4073-b103-86c187079135/blade_soft_swift_a.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTc1Zjk4YWEwMDBhOWE1YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwMTE5NH0.vB58thtnvelmHyulFrzBQMK6jbMnpo36DgFmziLScaU' -o /tmp/blade-v8/swift_a.mp3
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/1b775853-9f4b-4b15-ae3d-10b41d27b8f7/blade_soft_swift_b.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGZlZjJlYTM5NTNlMTkxYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDM1NTEwN30.lMAM1fNw81dugGosRQDRo4FyYKJ0sRyUNS9RVHIGkvE' -o /tmp/blade-v8/swift_b.mp3
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/963abb0f-9e58-4bc8-9a83-2321d6baca7b/blade_soft_crescent_a.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGZiNGY4NTgwZWJiOTdlNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQyODEyMH0.D_i5h5HyRmOgbu1mKQMJSgNNwEBwLr_szY6Xv3mJcEk' -o /tmp/blade-v8/crescent_a.mp3
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/42818947-1738-44f7-bd89-a691613ebbb0/blade_soft_crescent_b.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTJlNjkyMGEzY2JmNjAyNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDM5MzM1NH0.9zavfnBISGCTLFcr4-4KcFEryVhFT32fBq2YIODA29A' -o /tmp/blade-v8/crescent_b.mp3
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/909933f3-c26a-454a-9bdb-e0df047e2b59/blade_soft_cross_a.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2Y1ZjQ5YmFjN2ViZDE0YiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQzODIwMn0.UzkklfYS0d1jX7zdmXsfyT02FWIOsp3XhSL-xmWCheQ' -o /tmp/blade-v8/cross_a.mp3
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/cc16649e-38cb-4dc3-8982-268c4746cd79/blade_soft_cross_b.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTdjMWFhNTg3Y2M3OTM0ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDM4NzkyOH0.Sk7qqw0PrpiVji2bUaCpXrf49EtVhxfmnHW9Qn8ErAc' -o /tmp/blade-v8/cross_b.mp3

      - name: Master for smooth repeated gameplay
        run: |
          set -euo pipefail
          ffmpeg -y -i /tmp/blade-v8/swift_a.mp3    -af "highpass=f=55,lowpass=f=6500,equalizer=f=3300:t=q:w=0.9:g=-2.5,equalizer=f=230:t=q:w=0.8:g=1.2,loudnorm=I=-24:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_swift_a.mp3
          ffmpeg -y -i /tmp/blade-v8/swift_b.mp3    -af "highpass=f=55,lowpass=f=6500,equalizer=f=3300:t=q:w=0.9:g=-2.5,equalizer=f=230:t=q:w=0.8:g=1.2,loudnorm=I=-24:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_swift_b.mp3
          ffmpeg -y -i /tmp/blade-v8/crescent_a.mp3 -af "highpass=f=50,lowpass=f=6100,equalizer=f=3100:t=q:w=0.9:g=-2.8,equalizer=f=190:t=q:w=0.8:g=1.8,loudnorm=I=-23:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_crescent_a.mp3
          ffmpeg -y -i /tmp/blade-v8/crescent_b.mp3 -af "highpass=f=50,lowpass=f=6100,equalizer=f=3100:t=q:w=0.9:g=-2.8,equalizer=f=190:t=q:w=0.8:g=1.8,loudnorm=I=-23:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_crescent_b.mp3
          ffmpeg -y -i /tmp/blade-v8/cross_a.mp3    -af "highpass=f=55,lowpass=f=6300,equalizer=f=3200:t=q:w=0.9:g=-2.6,equalizer=f=210:t=q:w=0.8:g=1.4,loudnorm=I=-23:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_cross_a.mp3
          ffmpeg -y -i /tmp/blade-v8/cross_b.mp3    -af "highpass=f=55,lowpass=f=6300,equalizer=f=3200:t=q:w=0.9:g=-2.6,equalizer=f=210:t=q:w=0.8:g=1.4,loudnorm=I=-23:TP=-8:LRA=6" -ar 44100 -ac 2 -b:a 128k assets/sfx/v8/blade_cross_b.mp3

      - name: Commit SFX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/v8/*.mp3
          git commit -m "Import Blade Master soft slash SFX v8"
          git push
