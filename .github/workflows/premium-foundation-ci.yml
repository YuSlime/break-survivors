name: Premium Edition Foundation CI

on:
  push:
    branches:
      - premium-edition-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/premium-foundation-ci.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Premium runtime integration
        run: |
          if grep -q "PREMIUM SUPPORT" index.html; then
            echo "Premium foundation/combat V2 integration already present"
          else
            node tools/apply-premium-runtime-integration.mjs
          fi
      - name: Prepare Premium combat V2 review fixes
        run: node tools/apply-premium-combat-v2-review-fixes.mjs
      - name: Prepare Premium boss V2 integration
        run: node tools/apply-premium-boss-v2-integration.mjs
      - name: Prepare Premium boss reward integration
        run: node tools/apply-premium-boss-reward-integration.mjs
      - name: Prepare Premium audio integration
        run: node tools/apply-premium-audio-integration.mjs
      - name: Prepare Premium frame-state integration
        run: node tools/apply-premium-frame-state-integration.mjs
      - name: Prepare Premium combat presentation integrations
        run: |
          node tools/apply-premium-tactical-cap-integration.mjs
          node tools/apply-premium-tactical-readability-integration.mjs
          node tools/apply-premium-combat-feedback-integration.mjs
          node tools/apply-premium-death-presentation-integration.mjs
      - name: Prepare Premium boss death integration
        run: node tools/apply-premium-boss-death-integration.mjs
      - name: Prepare Premium FEVER transition
        run: node tools/apply-premium-fever-transition-integration.mjs
      - name: Run complete test suite
        run: |
          git diff --check
          node --test tests/*.test.mjs
