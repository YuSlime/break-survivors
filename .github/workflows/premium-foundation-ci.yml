name: Premium Edition Foundation CI

on:
  push:
    branches:
      - premium-edition-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/premium-foundation-ci.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare generated Premium integration
        run: |
          if grep -q "PREMIUM SUPPORT" index.html; then
            echo "Premium foundation/combat V2 integration already present"
          else
            node tools/apply-premium-runtime-integration.mjs
          fi
          node tools/apply-premium-combat-v2-review-fixes.mjs
          node tools/apply-premium-boss-v2-integration.mjs
          node tools/apply-premium-boss-reward-integration.mjs
          node tools/apply-premium-audio-integration.mjs
          node tools/apply-premium-frame-state-integration.mjs
      - name: Run complete test suite
        run: |
          git diff --check
          node --test tests/*.test.mjs
