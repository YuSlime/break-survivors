name: Premium Edition Foundation CI

on:
  push:
    branches:
      - premium-edition-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/premium-foundation-ci.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Premium runtime integration
        run: |
          if grep -q "PREMIUM SUPPORT" index.html; then
            echo "Premium foundation/combat V2 integration already present"
          else
            node tools/apply-premium-runtime-integration.mjs
          fi
      - name: Prepare Premium combat V2 review fixes
        run: node tools/apply-premium-combat-v2-review-fixes.mjs
      - name: Prepare Premium boss V2 integration
        run: node tools/apply-premium-boss-v2-integration.mjs
      - name: Prepare Premium boss reward integration
        run: node tools/apply-premium-boss-reward-integration.mjs
      - name: Prepare Premium audio integration
        run: node tools/apply-premium-audio-integration.mjs
      - name: Prepare Premium frame-state integration
        run: node tools/apply-premium-frame-state-integration.mjs
      - name: Prepare Premium combat presentation integrations
        run: |
          node tools/apply-premium-tactical-cap-integration.mjs
          node tools/apply-premium-tactical-readability-integration.mjs
          node tools/apply-premium-combat-feedback-integration.mjs
          node tools/apply-premium-death-presentation-integration.mjs
      - name: Prepare Premium boss death integration
        run: node tools/apply-premium-boss-death-integration.mjs
      - name: Prepare Premium FEVER transition
        run: node tools/apply-premium-fever-transition-integration.mjs
      - name: Prepare Premium LIMIT BREAK transition
        run: node tools/apply-premium-limit-break-transition-integration.mjs
      - name: Prepare Premium damage numbers
        run: node tools/apply-premium-damage-numbers-integration.mjs
      - name: Prepare Premium stage environment
        run: node tools/apply-premium-stage-environment-integration.mjs
      - name: Prepare Premium stage progression
        run: node tools/apply-premium-stage-progression-integration.mjs
      - name: Prepare Premium SECTOR SHIFT transition
        run: node tools/apply-premium-stage-transition-integration.mjs
      - name: Verify generated inline JavaScript
        run: node --test tests/index-inline-syntax.test.mjs
      - name: Run FEVER regression tests
        run: node --test tests/premium-fever-transition.test.mjs tests/premium-fever-transition-index.test.mjs
      - name: Run LIMIT BREAK transition regression tests
        run: node --test tests/premium-limit-break-transition.test.mjs tests/premium-limit-break-transition-index.test.mjs
      - name: Run damage number regression tests
        run: node --test tests/premium-damage-numbers.test.mjs tests/premium-damage-numbers-index.test.mjs
      - name: Run stage environment regression tests
        run: node --test tests/premium-stage-environment.test.mjs tests/premium-stage-environment-index.test.mjs tests/premium-stage-progression.test.mjs tests/premium-stage-progression-index.test.mjs tests/premium-stage-transition.test.mjs tests/premium-stage-transition-index.test.mjs
      - name: Run boss reward reintegration regression
        run: node --test tests/premium-boss-reward-integrator.test.mjs
      - name: Run Premium index tests
        run: node --test tests/premium-*-index.test.mjs tests/premium-index-integration.test.mjs
      - name: Run Premium runtime tests
        run: node --test tests/premium-runtime*.test.mjs tests/premium-foundation.test.mjs
      - name: Run Premium test group
        run: node --test tests/premium-*.test.mjs
      - name: Run Stage 11 legacy test group
        run: node --test tests/stage11*.test.mjs
      - name: Run complete test suite
        run: |
          git diff --check
          node --test tests/*.test.mjs
