name: Premium Edition Foundation CI

on:
  push:
    branches:
      - premium-edition-foundation
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/premium-foundation-ci.yml'

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete test suite
        run: node --test tests/*.test.mjs
