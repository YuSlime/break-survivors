name: Import Nova ULT Runway SFX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-nova-ult-sfx.yml'
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Nova ULT SFX
        shell: bash
        env:
          C_B64: ""
          O_B64: ""
          V_B64: ""
          F_B64: ""
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/nova/ult
          decode(){ printf '%s' "$1" | base64 -d; }
          curl -L --fail --retry 3 "$(decode "$C_B64")" -o assets/sfx/nova/ult/nova_ult_charge.mp3
          curl -L --fail --retry 3 "$(decode "$O_B64")" -o assets/sfx/nova/ult/nova_ult_orbit.mp3
          curl -L --fail --retry 3 "$(decode "$V_B64")" -o assets/sfx/nova/ult/nova_ult_converge.mp3
          curl -L --fail --retry 3 "$(decode "$F_B64")" -o assets/sfx/nova/ult/nova_ult_final.mp3
          for f in assets/sfx/nova/ult/*.mp3; do test -s "$f"; test "$(stat -c%s "$f")" -gt 2000; done
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-nova-ult-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Nova ULT Runway SFX"
          git push
