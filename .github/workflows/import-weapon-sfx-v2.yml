name: Import Weapon SFX V2

on:
  push:
    paths:
      - '.github/workflows/import-weapon-sfx-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
