name: Import Weapon SFX V2

on:
  push:
    paths:
      - '.github/workflows/import-weapon-sfx-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Diagnose one Runway sound
        run: |
          mkdir -p tmp assets/sfx/v2
          set +e
          echo "=== CURL ===" > sfx-v2-debug.txt
          curl -L --fail --retry 1 -v 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/1739eddf-c862-4113-a2da-37e58796e990/break_survivors_v2_pierce_fire_a.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDliOTdkYjdkNzI3N2E5YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwODg4N30.ISA5L644kPquyL4BzwtoAN7epJDTmcmVx3B6X5Z97GM' -o "tmp/pierce_fire_a.mp3" >> sfx-v2-debug.txt 2>&1
          echo "curl_exit=$?" >> sfx-v2-debug.txt
          ls -lh tmp >> sfx-v2-debug.txt 2>&1
          echo "=== FFPROBE ===" >> sfx-v2-debug.txt
          ffprobe -hide_banner "tmp/pierce_fire_a.mp3" >> sfx-v2-debug.txt 2>&1
          echo "ffprobe_exit=$?" >> sfx-v2-debug.txt
          echo "=== FFMPEG ===" >> sfx-v2-debug.txt
          ffmpeg -hide_banner -y -i "tmp/pierce_fire_a.mp3" -af "atrim=duration=0.28,highpass=f=70,lowpass=f=9000,afade=t=out:st=0.22:d=0.06,loudnorm=I=-29:TP=-10:LRA=5" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v2/pierce_fire_a.mp3" >> sfx-v2-debug.txt 2>&1
          echo "ffmpeg_exit=$?" >> sfx-v2-debug.txt
          ls -lh assets/sfx/v2 >> sfx-v2-debug.txt 2>&1
          set -e
      - name: Commit diagnostic
        run: |
          git config user.name "BREAK SURVIVORS Bot"
          git config user.email "actions@github.com"
          git add sfx-v2-debug.txt assets/sfx/v2
          git commit -m "Diagnose weapon SFX V2 import" || exit 0
          git push
