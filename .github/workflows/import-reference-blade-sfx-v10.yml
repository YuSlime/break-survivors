name: Import Reference Blade SFX v10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-reference-blade-sfx-v10.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode user reference
        shell: bash
        run: |
          mkdir -p /tmp/blade-ref assets/sfx/v10
          cat > /tmp/blade-ref/source.b64 <<'EOF'

EOF
          base64 -d /tmp/blade-ref/source.b64 > /tmp/blade-ref/source.mp3

      - name: Build reference-derived Blade Master SFX
        shell: bash
        run: |
          set -euo pipefail
          BASE="atrim=start=0.105:end=0.365,asetpts=PTS-STARTPTS,highpass=f=70,lowpass=f=7200,acompressor=threshold=-26dB:ratio=2.5:attack=2:release=45"

          ffmpeg -y -i /tmp/blade-ref/source.mp3 -af "$BASE,asetrate=47187,aresample=44100,afade=t=in:st=0:d=0.004,afade=t=out:st=0.215:d=0.035,loudnorm=I=-24:TP=-4:LRA=6" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_light_a.mp3
          ffmpeg -y -i /tmp/blade-ref/source.mp3 -af "$BASE,lowpass=f=6800,equalizer=f=850:t=q:w=0.8:g=1.2,afade=t=in:st=0:d=0.004,afade=t=out:st=0.225:d=0.035,loudnorm=I=-24:TP=-4:LRA=6" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_light_b.mp3
          ffmpeg -y -i /tmp/blade-ref/source.mp3 -af "$BASE,asetrate=41454,aresample=44100,lowpass=f=6500,equalizer=f=700:t=q:w=0.8:g=2.0,equalizer=f=190:t=q:w=0.8:g=1.4,afade=t=out:st=0.245:d=0.04,loudnorm=I=-23:TP=-4:LRA=6" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_crescent.mp3
          ffmpeg -y -i /tmp/blade-ref/source.mp3 -filter_complex "[0:a]$BASE,asetrate=47187,aresample=44100[a1];[0:a]$BASE,asetrate=48130,aresample=44100,adelay=78|78[a2];[a1][a2]amix=inputs=2:normalize=0,afade=t=out:st=0.30:d=0.045,loudnorm=I=-23:TP=-4:LRA=6[out]" -map "[out]" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_cross.mp3
          ffmpeg -y -i /tmp/blade-ref/source.mp3 -af "$BASE,asetrate=38808,aresample=44100,lowpass=f=6200,equalizer=f=220:t=q:w=0.8:g=3.0,afade=t=out:st=0.255:d=0.05,loudnorm=I=-22:TP=-3.5:LRA=6" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_heavy.mp3

          ffmpeg -y -i assets/sfx/v10/blade_ref_light_a.mp3 -i assets/sfx/v10/blade_ref_crescent.mp3 -i assets/sfx/v10/blade_ref_heavy.mp3 -filter_complex "[0:a]volume=0.78[a0];[1:a]adelay=100|100,volume=0.84[a1];[2:a]adelay=245|245,volume=0.92[a2];[a0][a1][a2]amix=inputs=3:normalize=0,afade=t=out:st=0.46:d=0.06,loudnorm=I=-22:TP=-3.5:LRA=6[out]" -map "[out]" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_special.mp3

          ffmpeg -y -i assets/sfx/v10/blade_ref_light_a.mp3 -i assets/sfx/v10/blade_ref_light_b.mp3 -filter_complex "[0:a]volume=0.48[a0];[1:a]adelay=55|55,volume=0.48[a1];[0:a]adelay=110|110,volume=0.48[a2];[1:a]adelay=165|165,volume=0.48[a3];[0:a]adelay=220|220,volume=0.46[a4];[1:a]adelay=280|280,volume=0.46[a5];[0:a]adelay=345|345,volume=0.44[a6];[1:a]adelay=415|415,volume=0.44[a7];[a0][a1][a2][a3][a4][a5][a6][a7]amix=inputs=8:normalize=0,afade=t=out:st=0.54:d=0.07,loudnorm=I=-21:TP=-3.5:LRA=6[out]" -map "[out]" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_ult.mp3

          ffmpeg -y -i assets/sfx/v10/blade_ref_heavy.mp3 -i assets/sfx/v10/blade_ref_light_a.mp3 -filter_complex "[0:a][base];[1:a]adelay=18|18,volume=0.48[snap];[base][snap]amix=inputs=2:normalize=0,afade=t=out:st=0.28:d=0.055,loudnorm=I=-21:TP=-3.2:LRA=6[out]" -map "[out]" -ar 44100 -ac 2 -b:a 160k assets/sfx/v10/blade_ref_ult_finish.mp3

      - name: Commit processed SFX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sfx/v10/*.mp3
          git commit -m "Import user-reference Blade Master SFX v10"
          git push
