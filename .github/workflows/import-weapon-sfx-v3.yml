name: Import Weapon SFX V3

on:
  push:
    paths:
      - '.github/workflows/import-weapon-sfx-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Import literal weapon SFX
        run: |
          set -e
          mkdir -p tmp assets/sfx/v3
          URL_PIERCE_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_PIERCE_FIRE" -o "tmp/pierce_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/pierce_fire.mp3" -af "atrim=duration=0.4,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.34:d=0.06,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/pierce_fire.mp3"
          URL_PIERCE_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_PIERCE_HIT" -o "tmp/pierce_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/pierce_hit.mp3" -af "atrim=duration=0.3,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.26:d=0.04,loudnorm=I=-29:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/pierce_hit.mp3"
          URL_EXPLOSION_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_EXPLOSION_FIRE" -o "tmp/explosion_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/explosion_fire.mp3" -af "atrim=duration=0.42,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.36:d=0.06,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/explosion_fire.mp3"
          URL_EXPLOSION_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_EXPLOSION_HIT" -o "tmp/explosion_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/explosion_hit.mp3" -af "atrim=duration=0.68,highpass=f=28,lowpass=f=12000,afade=t=out:st=0.58:d=0.10,loudnorm=I=-24:TP=-6:LRA=7" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/explosion_hit.mp3"
          URL_LIGHTNING_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_LIGHTNING_FIRE" -o "tmp/lightning_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/lightning_fire.mp3" -af "atrim=duration=0.36,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.31:d=0.05,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/lightning_fire.mp3"
          URL_LIGHTNING_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_LIGHTNING_HIT" -o "tmp/lightning_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/lightning_hit.mp3" -af "atrim=duration=0.3,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.26:d=0.04,loudnorm=I=-29:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/lightning_hit.mp3"
          URL_SLASH_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_SLASH_FIRE" -o "tmp/slash_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/slash_fire.mp3" -af "atrim=duration=0.46,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.39:d=0.07,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/slash_fire.mp3"
          URL_SLASH_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_SLASH_HIT" -o "tmp/slash_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/slash_hit.mp3" -af "atrim=duration=0.3,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.26:d=0.04,loudnorm=I=-29:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/slash_hit.mp3"
          URL_LASER_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_LASER_FIRE" -o "tmp/laser_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/laser_fire.mp3" -af "atrim=duration=0.5,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.42:d=0.07,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/laser_fire.mp3"
          URL_LASER_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_LASER_HIT" -o "tmp/laser_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/laser_hit.mp3" -af "atrim=duration=0.3,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.26:d=0.04,loudnorm=I=-29:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/laser_hit.mp3"
          URL_MISSILE_FIRE="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_MISSILE_FIRE" -o "tmp/missile_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/missile_fire.mp3" -af "atrim=duration=0.56,highpass=f=50,lowpass=f=12000,afade=t=out:st=0.48:d=0.08,loudnorm=I=-27:TP=-8:LRA=6" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/missile_fire.mp3"
          URL_MISSILE_HIT="$(printf '%s' '' | base64 -d)"
          curl -L --fail --retry 3 "$URL_MISSILE_HIT" -o "tmp/missile_hit.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/missile_hit.mp3" -af "atrim=duration=0.68,highpass=f=28,lowpass=f=12000,afade=t=out:st=0.58:d=0.10,loudnorm=I=-24:TP=-6:LRA=7" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/v3/missile_hit.mp3"
      - name: Verify
        run: |
          set -e
          test "$(find assets/sfx/v3 -name '*.mp3' | wc -l)" -ge 12
      - name: Commit
        run: |
          git config user.name "BREAK SURVIVORS Bot"
          git config user.email "actions@github.com"
          git add assets/sfx/v3
          git commit -m "Add literal weapon-matched Runway SFX V3" || exit 0
          git push
