name: Import Bomb Cat Runway SFX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-bombcat-runway-sfx.yml'

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Runway SFX
        shell: bash
        env:
          LAUNCH_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/c7e40ff5-c6f7-4c80-8d74-544c73d6be4c/bombcat_launch_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTVkMTBiZGU3ODVhZjkxOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ2MTAyMn0.9PlCVaA7-u9Z3EKFyQ3YCpm1Yc5oQnKMIhj9W2fwWXs"
          EXPLOSION_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/5ae3e932-0077-4f35-bed0-43f716a4f426/bombcat_explosion_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWJlY2E1MzA5OGM3MmMxOCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDM3ODU0NH0.v68qDL51HhbCpepLf5gJbuc1SeN1LzfeGSKoURO35rE"
          CLUSTER_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/62467016-3a73-4370-8edb-7291b8c7186f/bombcat_cluster_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWE2YWE2Yjc3NjY1MGY0MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDM5NzIzOX0.1sdNUGmGf7IV5Zi-eyXKOCTTjmKSsAlPE2Mn9XZbpb8"
          CHAIN_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/8f567f08-acdf-4c84-b925-51dda1c9672d/bombcat_chain_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjUyNzcyYzYxMDFhMGIzNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQzMzQ3OH0.-V6s1X09CQgjbzy1ouZDXh7OBd0p9Q4oA_8BbZuBlFQ"
          AFTERSHOCK_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/a6b5cefc-ea52-4439-8972-ef426452b5a7/bombcat_aftershock_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2Q3NjJmZjkxNTYxYzI1MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwMTUyOX0.-r3H4UEGP4YkX2joTJHOcVoTA2jktaADy1RClvaHFaY"
          ROYAL_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/3f833ae2-bdd7-4fa6-ac26-ee288f382f25/bombcat_royal_nuke_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmIxYWY4MjcyODIyYTk1YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQwMDU1MX0.LVwBAty4oE3q069UE1AEH5Av6qc03wL-Zj-GbsiZOVI"
          CATACLYSM_URL: "https://dnznrvs05pmza.cloudfront.net/audio_sfx/082ddaa9-8cc3-4b3b-bf3f-c92fe900848a/bombcat_cataclysm_bomb_base.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWJlMjgwNjM0ZTFmYzY1MyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQ1MTY4M30.DWXWzd8lqxvX55XWlZ0k9hOaPCi7X7aDlX3W4T83opQ"
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/bombcat
          curl -L --fail --retry 3 "$LAUNCH_URL" -o assets/sfx/bombcat/bombcat_launch.mp3
          curl -L --fail --retry 3 "$EXPLOSION_URL" -o assets/sfx/bombcat/bombcat_explosion.mp3
          curl -L --fail --retry 3 "$CLUSTER_URL" -o assets/sfx/bombcat/bombcat_cluster.mp3
          curl -L --fail --retry 3 "$CHAIN_URL" -o assets/sfx/bombcat/bombcat_chain.mp3
          curl -L --fail --retry 3 "$AFTERSHOCK_URL" -o assets/sfx/bombcat/bombcat_aftershock.mp3
          curl -L --fail --retry 3 "$ROYAL_URL" -o assets/sfx/bombcat/bombcat_royal.mp3
          curl -L --fail --retry 3 "$CATACLYSM_URL" -o assets/sfx/bombcat/bombcat_cataclysm.mp3
          for f in assets/sfx/bombcat/*.mp3; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 2000
          done

      - name: Commit imported audio and remove one-time importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-bombcat-runway-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Bomb Cat Runway SFX"
          git push
