name: Import Missile Queen Runway SFX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-missile-queen-sfx.yml'
permissions:
  contents: write
jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Missile Queen SFX
        shell: bash
        env:
          U1_HEX: ""
          U2_HEX: ""
          U3_HEX: ""
          U4_HEX: ""
          U5_HEX: ""
          U6_HEX: ""
          U7_HEX: ""
          U8_HEX: ""
          U9_HEX: ""
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/missilequeen
          decode(){ printf '%s' "$1" | xxd -r -p; }
          curl -L --fail --retry 3 "$(decode "$U1_HEX")" -o "assets/sfx/missilequeen/queen_launch_a.mp3"
          curl -L --fail --retry 3 "$(decode "$U2_HEX")" -o "assets/sfx/missilequeen/queen_launch_b.mp3"
          curl -L --fail --retry 3 "$(decode "$U3_HEX")" -o "assets/sfx/missilequeen/queen_swarm_split.mp3"
          curl -L --fail --retry 3 "$(decode "$U4_HEX")" -o "assets/sfx/missilequeen/queen_second_stage.mp3"
          curl -L --fail --retry 3 "$(decode "$U5_HEX")" -o "assets/sfx/missilequeen/queen_command.mp3"
          curl -L --fail --retry 3 "$(decode "$U6_HEX")" -o "assets/sfx/missilequeen/queen_ult_lock.mp3"
          curl -L --fail --retry 3 "$(decode "$U7_HEX")" -o "assets/sfx/missilequeen/queen_ult_rack.mp3"
          curl -L --fail --retry 3 "$(decode "$U8_HEX")" -o "assets/sfx/missilequeen/queen_ult_salvo.mp3"
          curl -L --fail --retry 3 "$(decode "$U9_HEX")" -o "assets/sfx/missilequeen/queen_ult_final.mp3"
          for f in assets/sfx/missilequeen/*.mp3; do test -s "$f"; test "$(stat -c%s "$f")" -gt 2000; done
      - name: Commit imported audio
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-missile-queen-sfx.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Missile Queen Runway SFX"
          git push
