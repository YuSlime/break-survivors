name: Import Runway SFX

on:
  push:
    paths:
      - '.github/workflows/import-runway-sfx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download and master Runway sound effects
