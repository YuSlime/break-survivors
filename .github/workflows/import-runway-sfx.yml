        run: |
          set -e
          test "$(find assets/sfx -name '*.mp3' | wc -l)" -eq 12
          ls -lh assets/sfx

      - name: Commit mastered sound effects
        run: |
          git config user.name "BREAK SURVIVORS Bot"
          git config user.email "actions@github.com"
          git add assets/sfx
          git commit -m "Add mastered Runway attack SFX" || exit 0
