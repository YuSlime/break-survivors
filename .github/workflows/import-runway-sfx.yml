          set -e
          mkdir -p tmp assets/sfx
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/audio_sfx/0dd581dc-c3a7-465d-b2a4-40d091c8cb63/break_survivors_gun_fire.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDJjOTJjOTNhZjJhOTdlNyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMzOTYwM30.E8FTdW_GuN7C9LFr2xhoEDqghVbSWHNt_WtxZwK1d-4' -o "tmp/gun_fire.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "tmp/gun_fire.mp3" -af "highpass=f=45,lowpass=f=9000,afade=t=out:st=0.40:d=0.08,loudnorm=I=-24:TP=-6:LRA=7" -ar 44100 -ac 2 -codec:a libmp3lame -b:a 128k "assets/sfx/gun_fire.mp3"
