name: Apply Orbital Gacha Final Polish v17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gacha-final-polish-v17.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message == 'Add one-shot orbital gacha final polish workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED — premium lighting pass is not present yet
        id: red
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'stage161OrbitalAwardLighting' in s, 'expected RED: stage161 is not implemented yet'
          PY

      - name: Verify RED failed for the intended reason
        if: steps.red.outcome != 'failure'
        run: |
          echo 'RED check unexpectedly passed; refusing to apply duplicate patch.'
          exit 1

      - name: Apply Stage 16.1 award-lighting and console polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='stage161OrbitalAwardLighting'
          if marker in s:
              raise SystemExit('stage161 already exists')
          css=r'''<style id="stage161OrbitalAwardLighting">
/* Stage 16.1 — final hero lighting / material / mobile-first impression pass */

/* 1) Stronger cinematic hierarchy: dark rails, luminous center, no full-screen glow. */
#gameWrap #gacha .orbitalGacha150{
  background:
    radial-gradient(ellipse at 50% 30%,#123847 0 5%,#081820 24%,transparent 48%),
    linear-gradient(90deg,#020508 0 15%,transparent 30% 70%,#020508 85% 100%),
    linear-gradient(180deg,#020609,#03080c 54%,#010305)!important;
}
#gameWrap #gacha .orbitalGacha150::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,#ffffff025 0 1px,transparent 1px),
    radial-gradient(ellipse at 50% 44%,transparent 0 43%,#0000003a 73%,#0000008c 100%);
}
#gameWrap #gacha .orbitalTop150,
#gameWrap #gacha .orbitalLayout150,
#gameWrap #gacha .orbitalConsole150{z-index:2}
#gameWrap #gacha .orbitalNav150,
#gameWrap #gacha .orbitalStory150{
  background:linear-gradient(180deg,#02070ba8,#010407e8)!important;
}

/* 2) Hero machine reads like one engineered object, not layered CSS rings. */
#gameWrap #gacha .orbitalStage150{
  isolation:isolate;
}
#gameWrap #gacha .orbitalStage150::after{
  content:"";position:absolute;left:50%;top:45%;width:min(760px,94%);height:520px;
  transform:translate(-50%,-50%);z-index:0;pointer-events:none;border-radius:50%;
  background:
    radial-gradient(ellipse,#83efff0d 0 14%,#42d9ff07 30%,transparent 67%);
  box-shadow:inset 0 -70px 90px #0005;
}
@media(min-width:1180px){
  #gameWrap #gacha .orbitalRig150{scale:1.045;transform-origin:50% 52%}
  #gameWrap #gacha .orbitalCrystal150{scale:1.055;transform-origin:50% 50%}
}
#gameWrap #gacha .rigOuter150{
  box-shadow:
    inset 0 0 0 1px #75858a73,
    inset 0 0 0 6px #0a1013,
    inset 0 -18px 26px #000a,
    0 0 0 2px #020405,
    0 28px 54px #000d!important;
}
#gameWrap #gacha .rigOuter150::after{
  border-color:#56839140!important;
  box-shadow:inset 0 0 24px #62e4ff08,0 0 0 1px #020405!important;
}
#gameWrap #gacha .rigInner150{
  box-shadow:inset 0 0 62px #42dcff0c,0 0 28px #0007!important;
}
#gameWrap #gacha .ceilingCore150{
  width:132px!important;height:18px!important;
  background:linear-gradient(90deg,#9eefff00,#e6fdff 30% 70%,#9eefff00)!important;
  box-shadow:0 0 14px #c9f9ff,0 0 40px #54dcff6b!important;
}
#gameWrap #gacha .orbitalLightColumn150{
  width:3px!important;opacity:.42!important;
  background:linear-gradient(180deg,#e8fdff00,#d9fbffbd 19%,#64ddff4d 61%,transparent)!important;
  box-shadow:0 0 10px #b9f5ff,0 0 26px #53dcff38!important;
}

/* 3) Crystal gets crisp white-hot core and darker facets for luxury contrast. */
#gameWrap #gacha .crystalVector156{
  filter:drop-shadow(0 12px 18px #000c) drop-shadow(0 0 9px #8be9ff52)!important;
}
#gameWrap #gacha .orbitalCrystal150::after{
  content:"";position:absolute;left:50%;top:50%;width:34px;height:54px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,#ffffffc9 0 8%,#a5f0ff55 27%,transparent 67%);
  box-shadow:0 0 16px #d9fbff73;
}

/* 4) Pods step back; the crystal remains the visual anchor. */
#gameWrap #gacha .corePod150{opacity:.9!important}
#gameWrap #gacha .corePod150.far{opacity:.5!important}
#gameWrap #gacha .corePod150.mid{opacity:.74!important}
#gameWrap #gacha .corePod150.near{opacity:.92!important}
#gameWrap #gacha .corePod150>em{
  border-top-color:#6e858f!important;
  box-shadow:0 0 0 1px #020405,0 5px 11px #0008!important;
}

/* 5) Right rail becomes art-direction, not a settings dashboard. */
#gameWrap #gacha .orbitalStory150 h2{
  letter-spacing:.005em!important;
  text-wrap:balance;
}
#gameWrap #gacha .orbitalStory150 h2 strong{
  background:linear-gradient(180deg,#f4fbfd,#b8e8f2 72%);
  -webkit-background-clip:text;background-clip:text;color:transparent!important;
  text-shadow:none!important;
}
#gameWrap #gacha .storyVisual150{
  min-height:132px;
  border-color:#263f4b!important;
  background:
    radial-gradient(circle at 69% 28%,#8688d85c 0 3%,transparent 18%),
    radial-gradient(ellipse at 50% 100%,#15374755 0,transparent 55%),
    linear-gradient(180deg,#07141d,#020508)!important;
}
#gameWrap #gacha .storyVisual150::after{
  content:"ORBITAL ARCHIVE // SIGNAL 07";position:absolute;left:10px;bottom:8px;
  color:#496a76;font:800 5px ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.16em;
}
#gameWrap #gacha .orbitalStory150 .orbitalIntel150{
  border-color:#142a34!important;
}

/* 6) Bottom hardware becomes a deliberate physical console. */
#gameWrap #gacha .orbitalConsole150{
  position:relative;
  background:
    linear-gradient(180deg,#060d12,#020507 75%),
    repeating-linear-gradient(90deg,#ffffff02 0 1px,transparent 1px 34px)!important;
  box-shadow:inset 0 1px #35515d35,0 -22px 45px #0003;
}
#gameWrap #gacha .orbitalConsole150::before{
  content:"";position:absolute;left:7%;right:7%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,#5bdff53b,transparent);
}
#gameWrap #gacha .hardwarePod150{
  border-color:#46575e!important;
  box-shadow:inset 0 1px #ffffff1c,inset 0 -9px #010304,0 15px 30px #000a!important;
}
#gameWrap #gacha .transferProtocol150{
  padding:10px 14px!important;border:1px solid #182f39;border-radius:12px;
  background:linear-gradient(180deg,#07131a,#040a0e);
  box-shadow:inset 0 1px #ffffff05,0 8px 18px #0005;
}
#gameWrap #gacha .transferRail150{
  height:18px!important;margin-top:7px!important;border-radius:4px;overflow:hidden;
}

/* 7) Summon CTAs: metal frame + glass face + clean type. */
#gameWrap #gacha .orbitalSummon150{
  min-height:88px!important;border-radius:22px!important;
  border-color:#3f6573!important;
  box-shadow:
    inset 0 1px #ffffff24,
    inset 0 -6px #02070a,
    0 0 0 2px #061017,
    0 15px 31px #000b!important;
}
#gameWrap #gacha .orbitalSummon150.single{
  background:
    linear-gradient(115deg,#ffffff0c 0 7%,transparent 7% 74%,#ffffff05 74% 78%,transparent 78%),
    radial-gradient(circle at 18% 50%,#42dff02a 0,transparent 37%),
    linear-gradient(180deg,#0e2a35,#06131a)!important;
}
#gameWrap #gacha .orbitalSummon150.ten{
  border-color:#887333!important;
  background:
    linear-gradient(115deg,#fff5c30b 0 7%,transparent 7% 74%,#fff2a405 74% 78%,transparent 78%),
    radial-gradient(circle at 18% 50%,#ffc43c20 0,transparent 38%),
    linear-gradient(180deg,#28210d,#100e07)!important;
}
#gameWrap #gacha .orbitalSummon150 span b{
  font-size:16px!important;font-weight:760!important;letter-spacing:.015em!important;
}
#gameWrap #gacha .orbitalSummon150 em{
  font-size:7px!important;opacity:.86;
}
#gameWrap #gacha .orbitalSummon150 span i{
  background:radial-gradient(circle,#102933,#061017 72%);
  box-shadow:inset 0 0 0 1px #ffffff0a;
}
#gameWrap #gacha .orbitalSummon150.ten span i{
  background:radial-gradient(circle,#2b240e,#0d0b05 72%);
}

/* 8) Legendary is precision gold: center / rails / CTA only. */
#gameWrap #gacha .orbitalGacha150:has(#gachaMachine.legendary) .orbitalStory150,
#gameWrap #gacha .orbitalGacha150:has(#gachaMachine.legendary) .orbitalNav150{
  filter:saturate(.62) brightness(.78)!important;
}
#gameWrap #gacha .orbitalGacha150:has(#gachaMachine.legendary) .orbitalStage150::after{
  background:radial-gradient(ellipse,#ffc83b0d 0 13%,#ffc83b04 34%,transparent 68%)!important;
}
#gameWrap #gacha .orbitalGacha150:has(#gachaMachine.legendary) .orbitalSummon150.ten{
  box-shadow:inset 0 1px #fff4bd24,inset 0 -6px #080501,0 0 0 2px #171004,0 15px 31px #000b,0 0 20px #ffc83b12!important;
}

/* 9) Mobile first impression: hero then action, minimal metadata before the CTA. */
@media(max-width:620px){
  #gameWrap #gacha .orbitalTop150{height:60px!important}
  #gameWrap #gacha .orbitalBrand150 span{font-size:10px!important;letter-spacing:.18em!important}
  #gameWrap #gacha #gachaMachine.orbitalMachine150{height:410px!important}
  #gameWrap #gacha .orbitalStageHead150{padding:0 12px!important}
  #gameWrap #gacha .orbitalStory150{
    padding:8px 10px!important;
    display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;
    border-top:1px solid #122731!important;
  }
  #gameWrap #gacha .orbitalStory150 .storyVisual150,
  #gameWrap #gacha .orbitalStory150 .storyOnline150,
  #gameWrap #gacha .orbitalStory150 .storyKicker150,
  #gameWrap #gacha .orbitalStory150 h2,
  #gameWrap #gacha .orbitalStory150>p,
  #gameWrap #gacha .orbitalStory150 blockquote{display:none!important}
  #gameWrap #gacha .orbitalStory150 .orbitalIntel150{
    margin:0!important;padding:0 8px!important;min-height:38px;
  }
  #gameWrap #gacha .orbitalStory150 .orbitalIntel150:last-child{grid-column:1/-1}
  #gameWrap #gacha .orbitalStory150 .gachaRoster,
  #gameWrap #gacha .orbitalStory150 .orbitalRates150,
  #gameWrap #gacha .orbitalStory150 .intelLine150{display:none!important}
  #gameWrap #gacha .orbitalConsole150{padding-top:8px!important}
  #gameWrap #gacha .hardwareRow150{min-height:68px!important}
  #gameWrap #gacha .hardwarePod150{height:58px!important}
  #gameWrap #gacha .orbitalSummon150{min-height:72px!important;border-radius:18px!important}
  #gameWrap #gacha .orbitalSummon150 span b{font-size:15px!important}
  #gameWrap #gacha .consoleMeta150{font-size:6px!important}
}
@media(max-width:390px){
  #gameWrap #gacha #gachaMachine.orbitalMachine150{height:382px!important}
  #gameWrap #gacha .orbitalStory150{grid-template-columns:1fr!important}
  #gameWrap #gacha .orbitalStory150 .orbitalIntel150:last-child{grid-column:auto}
  #gameWrap #gacha .orbitalSummon150{min-height:70px!important}
}

/* 10) Static mode remains art-directed. */
@media(prefers-reduced-motion:reduce){
  #gameWrap #gacha .orbitalRig150,#gameWrap #gacha .orbitalCrystal150{scale:1!important}
}
</style>'''
          if '</head>' not in s:
              raise SystemExit('missing </head>')
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: GREEN — verify new layer and existing scripts/tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'stage161OrbitalAwardLighting',
            '.orbitalStage150::after',
            '.orbitalSummon150.ten',
            '@media(max-width:620px)',
            'prefers-reduced-motion'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing: {missing}'
          assert s.count('stage161OrbitalAwardLighting')==1
          print('static premium QA: OK')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const scripts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!scripts.length) throw new Error('no inline scripts');
          scripts.forEach((code,i)=>{try{new Function(code)}catch(e){throw new Error('inline script '+i+': '+e.message)}});
          console.log('inline JS compile: OK ('+scripts.length+')');
          NODE
          node --test tests/stage11-threat.test.mjs tests/stage11-1-escalation.test.mjs

      - name: Render desktop and mobile QA screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          hook='''<script>addEventListener('load',()=>setTimeout(()=>{const b=document.getElementById('openGacha');if(b)b.click();},250));</script>'''
          Path('qa-gacha.html').write_text(s.replace('</body>',hook+'</body>',1),encoding='utf-8')
          PY
          python3 -m http.server 4173 >/tmp/qa-http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=3500 --screenshot=qa-gacha-desktop.png http://127.0.0.1:4173/qa-gacha.html
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3500 --screenshot=qa-gacha-mobile.png http://127.0.0.1:4173/qa-gacha.html
          else
            echo 'Chrome unavailable; render artifact skipped.'
            touch qa-render-skipped.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbital-gacha-qa-v17
          path: |
            qa-gacha-desktop.png
            qa-gacha-mobile.png
            qa-render-skipped.txt
          if-no-files-found: warn

      - name: Commit polished gacha
        run: |
          rm -f qa-gacha.html qa-gacha-desktop.png qa-gacha-mobile.png qa-render-skipped.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish orbital gacha hero lighting and premium console"
          git push
