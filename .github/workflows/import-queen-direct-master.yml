name: Import direct Missile Queen master
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-queen-direct-master.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/sfx/missilequeen
          base64 -d .tmp/queen_direct_master.b64 > assets/sfx/missilequeen/queen_direct_master.mp3
          test "$(stat -c%s assets/sfx/missilequeen/queen_direct_master.mp3)" -eq 5764
          test "$(head -c3 assets/sfx/missilequeen/queen_direct_master.mp3)" = "ID3"
      - name: Commit audio and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/queen_direct_master.b64
          rm -f .github/workflows/import-queen-direct-master.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import directly processed Missile Queen audio master"
          git push
