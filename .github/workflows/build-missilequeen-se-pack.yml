name: Build Missile Queen SE Pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-missilequeen-se-pack.yml'
permissions:
  contents: write
jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build current Missile Queen SE pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT="pack_missile_queen_se"
          rm -rf "$ROOT"
          mkdir -p "$ROOT" assets/downloads

          cp assets/sfx/missilequeen/queen_primary_a.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_primary_command.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_command.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_ult_lock.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_ult_rack.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_ult_final.mp3 "$ROOT/"
          cp assets/sfx/missilequeen/queen_direct_sprite.mp3 "$ROOT/"

          printf '%s\n'             'Missile Queen - Current SE Pack (Stage 10.18)'             ''             'queen_primary_a.mp3        Current normal attack SE'             'queen_primary_command.mp3  COMMAND SALVO launch'             'queen_command.mp3          COMMAND lock/confirm'             'queen_ult_lock.mp3         ULT lock'             'queen_ult_rack.mp3         ULT launcher deploy'             'queen_ult_final.mp3        Heavy final impact'             'queen_direct_sprite.mp3    Audio Sprite for split and ULT flight sounds'             ''             '[queen_direct_sprite.mp3 offsets]'             'SWARM SPLIT      2.410000 - 2.907333'             'SECOND STAGE     3.027333 - 4.277333'             'SKYFALL LAUNCH   4.397333 - 5.842770'             'SKYFALL DIVE     5.962770 - 6.912770'             "QUEEN'S DECREE   7.032770 - 10.124166"             'CROWN ARMADA     10.244166 - 10.875291'             ''             'The game changes playback rate/EQ/volume at runtime.'             'queen_primary_b.mp3 was removed in Stage 10.18.'             > "$ROOT/README.txt"

          rm -f assets/downloads/Missile_Queen_Current_SE.zip
          zip -qr assets/downloads/Missile_Queen_Current_SE.zip "$ROOT"
          test -s assets/downloads/Missile_Queen_Current_SE.zip
      - name: Commit pack and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-missilequeen-se-pack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add current Missile Queen SE pack"
          git push
